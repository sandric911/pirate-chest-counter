<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pirate Chest Counter</title>
  <link rel="icon" href="/icon.png">
  <link rel="preload" href="/fonts/BurbankBigCondensed-Black.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="/fonts/BurbankSmall-Bold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="booting">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- generic UI glyphs (Fortnite icons come from img/, see docs/ASSETS.md) -->
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 1.2a7.6 7.6 0 0 0-7.6 7.6c0 5.7 7.6 14 7.6 14s7.6-8.3 7.6-14A7.6 7.6 0 0 0 12 1.2zm0 4.5a3.1 3.1 0 1 1 0 6.2 3.1 3.1 0 0 1 0-6.2z"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 1.5 23.2 21.6H.8zm-1.3 6.5.4 7.4h1.8l.4-7.4zM12 16.8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 3.5v7h-7l2.6-2.6A6.6 6.6 0 0 0 5.4 10H2.6a9.4 9.4 0 0 1 15.5-4.3zM3.5 20.5v-7h7l-2.6 2.6a6.6 6.6 0 0 0 10.7-2.1h2.8a9.4 9.4 0 0 1-15.5 4.3z"/></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M15.4 3.4 6.8 12l8.6 8.6 2.1-2.1L11 12l6.5-6.5z"/></symbol>
      <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3 3h7v2.6H5.6V10H3zm11 0h7v7h-2.6V5.6H14zM3 14h2.6v4.4H10V21H3zm15.4 0H21v7h-7v-2.6h4.4z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><path d="M10 2.5a7.5 7.5 0 0 1 6 12l5.2 5.2-1.8 1.8-5.2-5.2A7.5 7.5 0 1 1 10 2.5zm0 2.6a4.9 4.9 0 1 0 0 9.8 4.9 4.9 0 0 0 0-9.8z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M10.6 3h2.8v7.6H21v2.8h-7.6V21h-2.8v-7.6H3v-2.8h7.6z"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M3 10.6h18v2.8H3z"/></symbol>
      <symbol id="w-min" viewBox="0 0 12 12"><path d="M1 6.5h10" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="w-close" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="currentColor" stroke-width="1.6"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="side" id="side">
      <nav class="nav" id="tabs">
        <a href="#/" data-tab="">Home</a>
        <a href="#/history" data-tab="history">History</a>
        <a href="#/efficiency" data-tab="efficiency">Efficiency</a>
        <a href="#/map" data-tab="map">Map</a>
        <a href="#/overlay" data-tab="overlay">Overlay</a>
        <a href="#/settings" data-tab="settings">Settings</a>
      </nav>
    </aside>
    <div class="main">
      <div class="titlebar" id="titlebar">
        <div class="winbtns" id="winbtns">
          <button class="wb" data-w="min" title="Minimize"><svg><use href="#w-min"/></svg></button>
          <button class="wb close" data-w="close" title="Close to tray"><svg><use href="#w-close"/></svg></button>
        </div>
      </div>
      <main id="view" class="view"></main>
    </div>
  </div>
  <div class="tip" id="tip"></div>
  <script src="/lib/leaflet/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
