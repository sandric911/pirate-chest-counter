<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Счётчик сундуков</title>
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- generic UI glyphs (Fortnite icons come from img/, see docs/ASSETS.md) -->
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 1.2a7.6 7.6 0 0 0-7.6 7.6c0 5.7 7.6 14 7.6 14s7.6-8.3 7.6-14A7.6 7.6 0 0 0 12 1.2zm0 4.5a3.1 3.1 0 1 1 0 6.2 3.1 3.1 0 0 1 0-6.2z"/></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 1.5 23.2 21.6H.8zm-1.3 6.5.4 7.4h1.8l.4-7.4zM12 16.8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20.5 3.5v7h-7l2.6-2.6A6.6 6.6 0 0 0 5.4 10H2.6a9.4 9.4 0 0 1 15.5-4.3zM3.5 20.5v-7h7l-2.6 2.6a6.6 6.6 0 0 0 10.7-2.1h2.8a9.4 9.4 0 0 1-15.5 4.3z"/></symbol>
    </defs>
  </svg>

  <header class="top">
    <a class="brand" href="#/"><img src="/icon.png" alt=""><span>Счётчик сундуков</span></a>
    <nav class="tabs" id="tabs">
      <a href="#/" data-tab="">Главная</a>
      <a href="#/history" data-tab="history">История</a>
      <a href="#/efficiency" data-tab="efficiency">Эффективность</a>
      <a href="#/map" data-tab="map">Карта</a>
      <a href="#/updates" data-tab="updates">Обновления</a>
    </nav>
    <div class="spacer"></div>
    <div class="chip" id="chip" title="Мои сундуки"><img src="/img/chest.webp" alt=""><span id="chipValue">—</span></div>
    <div class="ver" id="ver"></div>
  </header>
  <main id="view"><div class="loading">Загрузка…</div></main>
  <div class="tip" id="tip"></div>
  <script src="/app.js"></script>
</body>
</html>
