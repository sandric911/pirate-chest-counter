name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') { $v = '0.0.0' } else { $v = $Matches[1] }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/PirateChest.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/PirateChest.App/PirateChest.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }}
          -p:UpdateRepo=${{ github.repository }} -o publish

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/PirateChestCounter.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  PirateChestCounter.exe" | Out-File -Encoding ascii -NoNewline publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "$tag" --notes-file docs/RELEASE_NOTES.md publish/PirateChestCounter.exe publish/SHA256SUMS.txt
          } else {
            gh release upload $tag publish/PirateChestCounter.exe publish/SHA256SUMS.txt --clobber
          }
