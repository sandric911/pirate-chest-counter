name: release

on:
  push:
    tags: ['v*']
  # By hand (Actions → release → Run workflow, on main): give a version and the run builds the exe, creates the tag
  # vX.Y.Z on the commit it ran on and publishes the release. Without a version it only builds and tests.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, X.Y.Z (empty: build only)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $tag = "${{ github.ref_name }}"
          $release = 'false'
          if ("${{ github.ref_type }}" -eq 'tag' -and $tag -match '^v(\d+\.\d+\.\d+)$') { $v = $Matches[1]; $release = 'true' }
          elseif ($env:INPUT_VERSION) {
            if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.2.3, got '$env:INPUT_VERSION'" }
            if ("${{ github.ref }}" -ne 'refs/heads/main') { throw 'A release by hand is made from main only' }
            $v = $env:INPUT_VERSION; $release = 'true'
          }
          else { $v = '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/PirateChest.Core.Tests -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/PirateChest.App/PirateChest.App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }}
          -p:UpdateRepo=${{ github.repository }} -o publish

      - name: SHA256SUMS
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/PirateChestCounter.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  PirateChestCounter.exe" | Out-File -Encoding ascii -NoNewline publish/SHA256SUMS.txt
          Get-Content publish/SHA256SUMS.txt

      - name: Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            # --target only matters for a run by hand: there the tag does not exist yet and is created on this commit.
            gh release create $tag --target "${{ github.sha }}" --title "$tag" --notes-file docs/RELEASE_NOTES.md publish/PirateChestCounter.exe publish/SHA256SUMS.txt
          } else {
            gh release upload $tag publish/PirateChestCounter.exe publish/SHA256SUMS.txt --clobber
          }
